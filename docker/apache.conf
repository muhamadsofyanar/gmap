ServerName localhost
<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    # Callback URL contains a shared secret: redact queries and referrers for this path.
    SetEnvIf Request_URI "^/starsender-webhook\.php$" starsender_callback
    CustomLog /proc/self/fd/1 combined env=!starsender_callback
    CustomLog /proc/self/fd/1 "%a %t \"%m %U %H\" %>s %b" env=starsender_callback
    Timeout 180
</VirtualHost>
